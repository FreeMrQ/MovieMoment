name: Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 构建完成后创建 GitHub Release
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: MovieMoment

jobs:
  prepare:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter from .fvmrc
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Read version
        id: meta
        run: |
          version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "App version: ${version}"

  android:
    name: Android
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter from .fvmrc
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Configure Android signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Package artifacts
        run: |
          mkdir -p dist
          version="${{ needs.prepare.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/${APP_NAME}-${version}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/${APP_NAME}-${version}-android.aab"
          ls -lh dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter from .fvmrc
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p dist Payload
          version="${{ needs.prepare.outputs.version }}"
          app="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          if [[ -z "${app}" ]]; then
            echo "No .app found under build/ios/iphoneos" >&2
            find build/ios -maxdepth 4 -type d >&2 || true
            exit 1
          fi
          cp -R "${app}" Payload/
          zip -r "dist/${APP_NAME}-${version}-ios-unsigned.ipa" Payload
          ls -lh dist

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter from .fvmrc
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Disable code signing for CI
        run: |
          {
            echo 'CODE_SIGN_IDENTITY=-'
            echo 'CODE_SIGNING_REQUIRED=NO'
            echo 'CODE_SIGNING_ALLOWED=NO'
          } >> macos/Runner/Configs/Release.xcconfig

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          mkdir -p dist
          version="${{ needs.prepare.outputs.version }}"
          app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)"
          if [[ -z "${app}" ]]; then
            echo "No .app found under build/macos/Build/Products/Release" >&2
            find build/macos -maxdepth 6 -type d >&2 || true
            exit 1
          fi
          ditto -c -k --keepParent "${app}" "dist/${APP_NAME}-${version}-macos.zip"
          ls -lh dist

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter from .fvmrc
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = "${{ needs.prepare.outputs.version }}"
          $releaseDir = Get-ChildItem -Path build\windows -Recurse -Directory -Filter Release |
            Where-Object { $_.FullName -match 'runner\\Release$' } |
            Select-Object -First 1
          if (-not $releaseDir) {
            Write-Error "No Windows Release directory found"
            Get-ChildItem -Path build\windows -Recurse -Directory | Select-Object -ExpandProperty FullName
            exit 1
          }
          $zip = "dist\${env:APP_NAME}-${version}-windows.zip"
          Compress-Archive -Path (Join-Path $releaseDir.FullName '*') -DestinationPath $zip
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, android, ios, macos, windows]
    if: >-
      always() &&
      !cancelled() &&
      needs.android.result == 'success' &&
      needs.ios.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.windows.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
       (github.event_name == 'workflow_dispatch' && inputs.create_release))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.prepare.outputs.version) }}
          name: ${{ env.APP_NAME }} ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
